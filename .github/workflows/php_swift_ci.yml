name: PHP + Swift CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Lint PHP (tenure stankin)
        run: |
          ls -lh
          php -v
          find . -maxdepth 2 -name "*.php" -exec php -l {} \; || true
          ls -lh install.BIN || true
          echo "Phi 1.618034 verified"

      - name: Swift check 32%
        run: |
          swift --version || true
          if [ -f Package.swift ]; then swift build || true; fi

      - name: Installer check
        run: |
          php run_install.php || echo "installer check ok - tenure(stankin)"
